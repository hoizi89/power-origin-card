name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Attach the built card to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/power-origin-card.js
          generate_release_notes: true
          append_body: true
          body: |

            ---
            ☕ If the card earns its place on your wall: [buy me a coffee](https://buymeacoffee.com/hoizi89).
